name: Bug report
description: Report a reproducible problem in Semantic Model Cleaner
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce it locally.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the issue
      placeholder: Export fails after analysis completes
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps
      placeholder: |
        1. Run ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and how you ran the tool
      placeholder: Windows 11, Python 3.11, semantic-model-cleaner-web .
