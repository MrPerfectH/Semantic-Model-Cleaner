name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for concrete product or workflow improvements.
  - type: input
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
      placeholder: It is hard to review changes before cleanup actions are applied
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you want
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional notes on workarounds or other approaches
