name: VS Code extension

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths: ['vscode-extension/**', 'packaging/vscode/**', 'scripts/verify_vscode_packages.py', 'pyproject.toml', 'src/semantic_model_cleaner/**', 'tests/test_vscode_host.py', 'tests/test_vscode_release.py', '.github/workflows/vscode-extension.yml']
  pull_request:
    paths: ['vscode-extension/**', 'packaging/vscode/**', 'scripts/verify_vscode_packages.py', 'pyproject.toml', 'src/semantic_model_cleaner/**', 'tests/test_vscode_host.py', 'tests/test_vscode_release.py', '.github/workflows/vscode-extension.yml']

jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .[dev]
      - run: python -m pytest tests/test_local_http_security.py tests/test_vscode_host.py tests/test_vscode_release.py
      - run: npm ci
        working-directory: vscode-extension
      - run: npm test
        working-directory: vscode-extension
      - name: Build native bundled engine
        run: python packaging/vscode/build_engine.py
      - run: npm run package
        working-directory: vscode-extension
      - name: Verify native package identity and checksum
        shell: bash
        run: |
          target=$(node -p 'process.platform + "-" + process.arch')
          python scripts/verify_vscode_packages.py --target "$target" vscode-extension/*.vsix
      - name: Verify installed bundled VSIX on Windows
        if: runner.os == 'Windows'
        run: node scripts/test-bundled.cjs
        working-directory: vscode-extension
      - name: Verify installed bundled VSIX on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-bundled.cjs
        working-directory: vscode-extension
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundled-acceptance-${{ matrix.os }}
          path: vscode-extension/integration-artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: cleaner-vsix-${{ matrix.os }}
          path: |
            vscode-extension/*.vsix
            vscode-extension/*.vsix.sha256
