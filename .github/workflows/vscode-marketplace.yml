name: Publish Cleaner Marketplace pre-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/vscode-extension.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download verified native packages
        uses: actions/download-artifact@v4
        with:
          pattern: cleaner-vsix-*
          merge-multiple: true
          path: vscode-extension/verified-packages
      - name: Publish exact verified pre-release packages
        shell: bash
        run: |
          shopt -s nullglob
          packages=(verified-packages/*.vsix)
          python ../scripts/verify_vscode_packages.py --target win32-x64 --target linux-x64 \
            --target darwin-x64 --target darwin-arm64 "${packages[@]}"
          for package in "${packages[@]}"; do
            npx --no-install vsce publish --packagePath "$package" --pre-release
          done
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
