name: Publish Cleaner Marketplace pre-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test engine
        working-directory: .
        run: python -m pip install -e '.[dev]'
      - name: Test host security
        working-directory: .
        run: python -m pytest tests/test_local_http_security.py tests/test_vscode_host.py
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-model-cleaner-0.1.5
          path: vscode-extension/semantic-model-cleaner-0.1.5.vsix
          if-no-files-found: error
      - name: Publish exact pre-release package
        run: npx --no-install vsce publish --packagePath semantic-model-cleaner-0.1.5.vsix --pre-release
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
