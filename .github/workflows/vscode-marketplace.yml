name: Publish Cleaner to Marketplace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/vscode-extension.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download verified native packages
        uses: actions/download-artifact@v4
        with:
          pattern: cleaner-vsix-*
          merge-multiple: true
          path: vscode-extension/verified-packages
      - name: Publish exact verified packages
        shell: bash
        run: |
          shopt -s nullglob
          packages=(verified-packages/*.vsix)
          python ../scripts/verify_vscode_packages.py --target win32-x64 --target linux-x64 \
            --target darwin-x64 --target darwin-arm64 "${packages[@]}"
          # A pre-release engine (a, b, rc, dev) publishes as a Marketplace pre-release; a final engine publishes stable.
          channel=()
          if python -c "import re, sys, tomllib; v = tomllib.load(open('../pyproject.toml', 'rb'))['project']['version']; sys.exit(0 if re.search(r'(a|b|rc|\.dev)\d+$', v) else 1)"; then
            channel=(--pre-release)
          fi
          for package in "${packages[@]}"; do
            npx --no-install vsce publish --packagePath "$package" "${channel[@]}"
          done
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
