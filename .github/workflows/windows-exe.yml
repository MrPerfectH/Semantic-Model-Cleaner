name: Public beta packages

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/windows-exe.yml"
      - "packaging/windows/**"
      - "scripts/release_checksums.py"
      - "scripts/smoke_wheel.py"
      - "scripts/verify_release_identity.py"
      - "pyproject.toml"
      - "src/semantic_model_cleaner/**"
      - "tests/**"
  push:
    tags:
      - "v*"

jobs:
  python-package:
    name: Build and consume Python distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install source validation and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Verify beta identity and tag
        run: python scripts/verify_release_identity.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Validate source
        run: |
          python -m ruff check .
          python -m pytest

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install wheel with dependencies in a fresh environment
        run: python scripts/smoke_wheel.py dist/*.whl

      - name: Write Python distribution checksums
        run: python scripts/release_checksums.py write dist/*.whl dist/*.tar.gz

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.whl.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  windows-build:
    name: Build Windows ZIP
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Verify beta identity and tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/verify_release_identity.py --tag "$env:RELEASE_TAG"

      - name: Build Windows package
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Upload unverified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/semantic-model-cleaner-windows-x64-*.zip
            dist/semantic-model-cleaner-windows-x64-*.zip.sha256
          if-no-files-found: error

  windows-verify:
    name: Verify downloaded Windows ZIP
    needs: windows-build
    runs-on: windows-latest
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@v4

      - name: Set up verification Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser driver
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install chromium

      - name: Download ZIP outside the checkout
        uses: actions/download-artifact@v5
        with:
          name: windows-package
          path: ${{ runner.temp }}/release under test

      - name: Run executable and browser end-to-end verification
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP "release under test"
          $zip = Get-ChildItem $download -Filter "*.zip" | Select-Object -First 1
          $checksum = Get-ChildItem $download -Filter "*.zip.sha256" | Select-Object -First 1
          if (-not $zip -or -not $checksum) { throw "Downloaded ZIP or checksum is missing" }
          python packaging/windows/smoke.py --zip $zip.FullName --sha256 $checksum.FullName --evidence-dir (Join-Path $env:RUNNER_TEMP "windows verification evidence")

      - name: Upload Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification-evidence
          path: ${{ runner.temp }}/windows verification evidence
          if-no-files-found: warn

  publish-prerelease:
    name: Publish GitHub prerelease
    if: github.ref_type == 'tag'
    needs: [python-package, windows-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download Python distributions
        uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: release-assets/python

      - name: Download verified Windows package
        uses: actions/download-artifact@v5
        with:
          name: windows-package
          path: release-assets/windows

      - name: Verify every release checksum
        run: python scripts/release_checksums.py verify release-assets/python/*.sha256 release-assets/windows/*.sha256

      - name: Create or update prerelease and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --title "Semantic Model Cleaner $VERSION public beta" --notes-file docs/releases/0.4.0b1.md
          else
            gh release create "$RELEASE_TAG" --prerelease --verify-tag --title "Semantic Model Cleaner $VERSION public beta" --notes-file docs/releases/0.4.0b1.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/python/* release-assets/windows/* --clobber
