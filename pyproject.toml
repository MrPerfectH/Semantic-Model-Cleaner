[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-model-cleaner"
version = "0.1.1"
description = "Analyze Power BI PBIR + TMDL projects and apply semantic model cleanup actions locally."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["power-bi", "pbir", "tmdl", "semantic-model", "cli", "flask"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "flask>=3.1,<4",
    "openpyxl>=3.1,<4",
    "waitress>=3.0,<4",
]

[project.urls]
Homepage = "https://github.com/MrPerfectH/Semantic-Model-Cleaner"
Repository = "https://github.com/MrPerfectH/Semantic-Model-Cleaner"
Issues = "https://github.com/MrPerfectH/Semantic-Model-Cleaner/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pyinstaller>=6.14,<7",
    "pytest>=9,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
semantic-model-cleaner = "semantic_model_cleaner.cli:main"
semantic-model-cleaner-web = "semantic_model_cleaner.webapp:main"
semantic-model-cleaner-desktop = "semantic_model_cleaner.windows_launcher:main"
smc = "semantic_model_cleaner.cli:main"
smc-web = "semantic_model_cleaner.web:main"
smc-desktop = "semantic_model_cleaner.windows_launcher:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semantic_model_cleaner = ["templates/*.html", "demo_workspace/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
